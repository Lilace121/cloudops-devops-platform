apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-demo


spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudops-demo


  template:
    metadata:
      labels:
        app: cloudops-demo


    spec:
      containers:

      - name: cloudops-demo

        image: cloudops-demo:v1

        imagePullPolicy: IfNotPresent

        ports:

        - containerPort: 8081


        env:

        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: cloudops-config
              key: APP_NAME


        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: cloudops-config
              key: ENV


        - name: VERSION
          valueFrom:
            configMapKeyRef:
              name: cloudops-config
              key: VERSION
